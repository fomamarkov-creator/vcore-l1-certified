name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Build Linked Lean 4 Certifier
        run: |
          lake update
          lake exe cache get
          lake build
          lake exe vcore_certifier --verify-bench

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU & Run Quantizer Benchmark
        run: |
          pip install --upgrade pip
          pip install numpy torch --index-url https://pytorch.org
          pip install -e . --no-deps
          python test_quantizer.py
