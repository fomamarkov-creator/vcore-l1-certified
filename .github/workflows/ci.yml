name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Elan & Lean 4
        run: |
          curl -sSfL https://github.com | tar xz
          ./elan-init -y --default-toolchain leanprover/lean4:v4.37.0-rc1
          rm -f elan-init
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Linked Lean 4 Certifier
        run: |
          lake update
          lake exe cache get
          lake build
          lake exe vcore_certifier --verify-bench

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU & Run Quantizer Benchmark
        run: |
          pip install --upgrade pip
          pip install numpy safetensors torch --index-url https://pytorch.org
          pip install -e . --no-deps
          python test_quantizer.py
          
