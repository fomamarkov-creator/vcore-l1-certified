name: V-CORE L1-Certified CI (Lean 4 + C++/AVX2/NEON + PyTorch)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lean-and-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4 (elan) & Build Formal Certifier
        run: |
          set -e
          curl --retry 3 -sSf https://githubusercontent.com | sh -s -- -y --default-toolchain leanprover/lean4:v4.37.0-rc1
          export PATH="$HOME/.elan/bin:$PATH"
          lake build vcore_certifier
          ./.lake/build/bin/vcore_certifier --verify-bench

      - name: Build Native C++17 / AVX2 / NEON Engine
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          ./build/vcore-run

      - name: Set up Python 3.11 & Run End-to-End Quantization Tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & Run test_quantizer.py
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          pip install numpy safetensors torch --index-url https://pytorch.org
          pip install -e .
          python3 -u test_quantizer.py 2>&1
          
