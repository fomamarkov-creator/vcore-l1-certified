[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcore-l1-certified"
version = "4.0.0"
description = "Hybrid Lean 4 + GPU 1.58-bit & INT4 Neural Network Quantizer, Inference Engine & GGUF Exporter"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "E. S. Markov", email = "ef.87@mail.ru"}
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "gguf>=0.10.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
transformers = ["transformers>=4.40.0"]

[project.scripts]
vcore-pack = "vcore_l1.cli:main"
vcore-bench = "vcore_l1.bench:main"
vcore-export-gguf = "vcore_l1.gguf_exporter:main"
vcore-ui = "vcore_l1.tui:main"
vcore-web = "vcore_l1.web_ui:main"

[tool.setuptools]
packages = ["vcore_l1"]
